<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de compras | Drogavaz</title>
    <!-- Padronização visual reutilizando a folha de estilo principal -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <!-- Cabeçalho padronizado da aplicação -->
     <header>
        <h1>Drogavaz</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="enviar-receita.html">Enviar Receita</a></li>
                <!-- Link direto para o carrinho para permitir acesso à finalização de compra -->
                <li><a href="carrinho.html">Carrinho</a></li>
            </ul>
        </nav>
     </header>

    <!-- Estrutura principal do carrinho -->
     <main class="carrinho-layout">

        <!-- Area das seções do carrinho -->
        <section class="secao-itens">

            <!-- Cabeçalho simples da seção -->
            <div class="secao-cabecalho">
                <h2>Produto Drogavaz</h2>
            </div>

            <!-- Pilha de itens no carrinho -->
            <ul class="pilha-itens">

                <!-- Card de item 1 -->
                <li class="Card-item">
                    <!-- Imagem do produto com texto alternativo para acessibilidade -->
                     <div class="item-imagem">
                        <img src="https://via.placeholder.com/200x200?text=Dipirona" alt="Dipirona Monoidratada 500mg">
                     </div>

                     
                    <!-- Informaçõe sobre o item escolhido-->
                    <div class="item-info">
                        <h3 class="item-titulo">Dipirona Monoidratada 500mg | Generico</h3>
                    </div>

                    <!-- seletor de quantidade do item -->
                    <div class="item-quantidade">
                        <label for="quantidade"></label>
                        <select id="quantidade">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                        </select>
                    </div>

                    <!-- Preço de cada item por unidade -->
                    <div class="item-valor">
                        <data value="12,00" class="valor-antigo">R$ 12,00</data>
                        <data value="8,99" class="valor-atual">R$ 8,99</data>
                    </div>

                     <!-- Opção de poder remover do carrinho -->
                    <button class="botao-remover">remover</button>
                </li>
            </ul>
        </section>
     </main>
</body>
</html>
